name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Setup JDK and Gradle
      uses: optyfr-org/composite-actions/setup-gradle@5d5db305592dd78357c2980b4482d9dc3b692311 # v1

    - name: Restore build cache
      uses: optyfr-org/composite-actions/build-cache@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
      with:
        mode: restore

    - name: Build and test with Gradle
      run: ./gradlew -Pagent test

    - name: Upload JaCoCo coverage report
      uses: optyfr-org/composite-actions/upload-jacoco@5d5db305592dd78357c2980b4482d9dc3b692311 # v1

    - name: Save test cache
      if: always()
      uses: optyfr-org/composite-actions/build-cache@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
      with:
        mode: save
        cache-name: cache-test
        path: |
          build/native
          build/classes/java/test
          build/jacoco
          build/reports
          build/test-results
