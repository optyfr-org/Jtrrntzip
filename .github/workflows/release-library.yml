name: Library

on:
  workflow_call:
    inputs:
      release-version:
        description: Release version (without v prefix)
        required: true
        type: string

env:
  JAVA_VERSION: '25'
  JAVA_DIST: graalvm

jobs:
  library:
    name: Library artifact and Maven package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup JDK and Gradle
        uses: optyfr-org/composite-actions/setup-gradle@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DIST }}

      - name: Build library artifact
        run: ./gradlew distZip2 -x test

      - name: Publish to GitHub Packages
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish -x test

      - name: Add library artifact to release
        uses: optyfr-org/composite-actions/upload-release-asset@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          tag: ${{ github.ref_name }}
          file: build/distributions/Jtrrntzip-${{ env.RELEASE_VERSION }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
