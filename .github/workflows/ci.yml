name: Java CI with Gradle

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'graalvm'
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

    - name: Build with Gradle
      run: ./gradlew build -x test

    - name: Save build cache
      id: cache
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        cache-name: cache-builds
      with:
        path: build
        key: ${{ env.cache-name }}-${{ github.sha }}

  test:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'graalvm'
        java-version: '25'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

    - name: Restore build cache
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        cache-name: cache-builds
      with:
        path: build
        key: ${{ env.cache-name }}-${{ github.sha }}

    - name: Build and test with Gradle
      run: ./gradlew -Pagent test

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: jacoco-coverage-report
        path: build/reports/jacoco/
        retention-days: 30

    - name: Save test cache
      if: always()
      id: cache-test
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        cache-name: cache-test
      with:
        path: |
          build/native
          build/classes/java/test
          build/jacoco
          build/reports
          build/test-results
        key: ${{ env.cache-name }}-${{ github.sha }}

  sonar:
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up JDK 25
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: 'graalvm'
        java-version: '25'

    - name: Restore build cache
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        cache-name: cache-builds
      with:
        path: build
        key: ${{ env.cache-name }}-${{ github.sha }}

    - name: Restore test cache
      id: cache-test
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        cache-name: cache-test
      with:
        path: |
          build/native
          build/classes/java/test
          build/jacoco
          build/reports
          build/test-results
        key: ${{ env.cache-name }}-${{ github.sha }}

    - name: Sonar with Gradle
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./gradlew sonar --info
