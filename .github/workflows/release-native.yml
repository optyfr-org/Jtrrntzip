name: Native

on:
  workflow_call:
    inputs:
      release-version:
        description: Release version (without v prefix)
        required: true
        type: string

env:
  JAVA_VERSION: '25'
  JAVA_DIST: graalvm

jobs:
  native:
    name: native ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-amd64
            os: windows-latest
            binary: jtrrntzip.exe
            ext: .exe
          - id: linux-amd64
            os: ubuntu-latest
            binary: jtrrntzip
            ext: ''
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            binary: jtrrntzip
            ext: ''
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ inputs.release-version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup JDK and Gradle
        uses: optyfr-org/composite-actions/setup-gradle@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          java-version: ${{ env.JAVA_VERSION }}
          java-distribution: ${{ env.JAVA_DIST }}

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Native compile
        run: |
          mkdir -p build/native/agent-config
          ./gradlew nativeCompile -x test

      - name: prepare native artifact
        id: asset
        run: |
          ASSET="jtrrntzip-${RELEASE_VERSION}-${{ matrix.id }}${{ matrix.ext }}"
          cp "build/native/nativeCompile/${{ matrix.binary }}" "${ASSET}"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"

      - name: Add native artifact to release
        uses: optyfr-org/composite-actions/upload-release-asset@5d5db305592dd78357c2980b4482d9dc3b692311 # v1
        with:
          tag: ${{ github.ref_name }}
          file: ${{ steps.asset.outputs.asset }}
          token: ${{ secrets.GITHUB_TOKEN }}
